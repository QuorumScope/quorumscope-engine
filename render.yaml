# Render blueprint for a free staging deployment: PostgreSQL and one web service.
#
# The web service runs the indexer in watch mode in the background and the API in the foreground.
# The API applies migrations when it starts, and the indexer polls as soon as it starts, so the
# first poll is the one-shot index.
#
# Limits of the free plan: the web service sleeps after 15 minutes without requests. The indexer
# stops while it sleeps, and the API reports freshness as stale until the service wakes and
# polls again. The free database expires after 30 days. For a standing deployment, run the
# indexer as a separate background worker on a paid plan.
databases:
  - name: quorumscope-db
    plan: free
    databaseName: quorumscope
    user: quorumscope

services:
  - type: web
    name: quorumscope-engine-api
    runtime: docker
    plan: free
    healthCheckPath: /health/ready
    dockerCommand: sh -c "quorumscope index watch & exec quorumscope serve"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quorumscope-db
          property: connectionString
      - key: API_BIND
        value: 0.0.0.0:10000
      - key: NETWORK_NAME
        value: testnet
      - key: NETWORK_PASSPHRASE
        value: Test SDF Network ; September 2015
      - key: STELLAR_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: POLLING_INTERVAL_SEC
        value: "5"
      - key: VERIFIED_PROTOCOL_MAX
        value: "28"
      - key: LOG_LEVEL
        value: info
      # The exact console origin, for example https://quorumscope-console-staging.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
