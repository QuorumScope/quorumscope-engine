# Local development database. Set POSTGRES_PASSWORD in your shell or .env before starting.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quorumscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: quorumscope
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quorumscope"]
      interval: 2s
      timeout: 2s
      retries: 10
