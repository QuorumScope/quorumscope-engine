version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quorumscope
      POSTGRES_PASSWORD: password
      POSTGRES_DB: quorumscope
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quorumscope"]
      interval: 2s
      timeout: 2s
      retries: 10
