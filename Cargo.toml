[workspace]
members = [
    "crates/quorumscope-domain",
    "crates/quorumscope-xdr",
    "crates/quorumscope-rpc",
    "crates/quorumscope-freeze",
    "crates/quorumscope-preflight",
    "crates/quorumscope-impact",
    "crates/quorumscope-storage",
    "crates/quorumscope-indexer",
    "crates/quorumscope-api",
    "crates/quorumscope-report",
    "crates/quorumscope-cli"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"

[workspace.dependencies]
stellar-xdr = { version = "28.0.1", default-features = false }
axum = "0.8.9"
tokio = "1.53.1"
reqwest = "0.13.5"
sqlx = "0.9.0"
tower-http = "0.7.1"
utoipa = "6.0.0"
serde = "1.0.229"
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
clap = "4.6.7"
uuid = "1.26.1"
thiserror = "2.0.21"
anyhow = "1.0.104"
sha2 = "0.11.0"
base64 = "0.23.1"
hex = "0.4.3"
time = "0.3.55"
