[workspace]
members = [
    "crates/quorumscope-domain",
    "crates/quorumscope-xdr",
    "crates/quorumscope-rpc",
    "crates/quorumscope-freeze",
    "crates/quorumscope-preflight",
    "crates/quorumscope-impact",
    "crates/quorumscope-storage",
    "crates/quorumscope-indexer",
    "crates/quorumscope-api",
    "crates/quorumscope-report",
    "crates/quorumscope-cli"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"

[workspace.dependencies]
chrono = { version = "0.4.38" }
sqlx = { version = "0.8.2", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros"] }
url = "2.5.2"
stellar-xdr = { version = "28.0.1", features = ["std", "alloc"] }
axum = "0.8.9"
tokio = "1.53.1"
reqwest = "0.13.5"
tower-http = "0.7.1"
utoipa = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
clap = "4.6.7"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
sha2 = "0.11.0"
base64 = "0.23.1"
hex = "0.4.3"
time = "0.3.55"
