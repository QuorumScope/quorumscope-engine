version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-compatible:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: stellar-xdr
        update-types: ["version-update:semver-major"]
      - dependency-name: sqlx
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
