name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quorumscope
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quorumscope
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quorumscope -d quorumscope"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v3
    - name: Install Typst
      run: |
        curl -sL https://github.com/typst/typst/releases/download/v0.11.0/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ
        sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
    - name: Format
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    - name: Test
      env:
        API_TEST_DATABASE_URL: postgres://quorumscope:password@localhost:5432/quorumscope
      run: cargo test --workspace --all-features
    - name: Doc
      run: cargo doc --workspace --no-deps
