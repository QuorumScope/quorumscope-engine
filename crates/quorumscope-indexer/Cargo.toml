[package]
description = "QuorumScope component"
repository = "https://github.com/QuorumScope/quorumscope-engine"
authors = ["zeepearl56"]
name = "quorumscope-indexer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sqlx.workspace = true
uuid.workspace = true
base64.workspace = true
stellar-xdr.workspace = true
tokio.workspace = true
quorumscope-domain = { path = "../quorumscope-domain", version = "0.1.0" }
quorumscope-rpc = { path = "../quorumscope-rpc", version = "0.1.0" }
quorumscope-storage = { path = "../quorumscope-storage", version = "0.1.0" }
quorumscope-xdr = { path = "../quorumscope-xdr", version = "0.1.0" }
tracing.workspace = true
thiserror.workspace = true
hex = { workspace = true }
serde_json = { workspace = true }
quorumscope-freeze = { path = "../quorumscope-freeze", version = "0.1.0" }

[lib]
path = "src/lib.rs"

[dev-dependencies]
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { workspace = true, features = ["full"] }
uuid.workspace = true
wiremock = "0.6.5"
